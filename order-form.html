
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order | Yadirtydog</title>
  <link rel="icon" href="images/favicon.png" type="image/png">
  <style>
    body {
      background-color: #0000ff;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
      margin-bottom: 20px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 300px;
    }
    label {
      font-size: 18px;
    }
    input, select, textarea {
      padding: 10px;
      border: 2px solid rgb(0, 0, 0);
      border-radius: 5px;
      font-size: 16px;
      color: #0000ff;
      background-color: #ffffff;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    button {
      padding: 10px;
      background-color: rgb(255, 255, 255);
      color: #0000ff;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      cursor: pointer;
    }
    button:hover {
      background-color: rgb(255, 251, 0);
    }
  </style>
</head>
<body>
  <h1>Order a Design</h1>
  <form action="mailto:yadirtydoug@gmail.com" method="POST" enctype="text/plain">
    <label for="name">Your Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Lottery code:</label>
    <input type="email" id="email" name="email" required>

    <label for="design-type">Choose a design type:</label>
    <select id="design-type" name="design-type" required>
      <optgroup label="VIDEO">
        <option value="music-video">Music Video</option>
        <option value="promo-reel">Promo Reel</option>
        <option value="ad-edit">Ad Edit</option>
      </optgroup>
      <optgroup label="GRAPHICS">
        <option value="poster">Poster</option>
        <option value="flyer">Flyer</option>
        <option value="logo">Logo</option>
        <option value="social-media">Social Media</option>
      </optgroup>
      <optgroup label="WEB DEV">
        <option value="landing-page">Landing Page</option>
        <option value="full-site">Full Website</option>
        <option value="ecommerce">E-commerce Site</option>
      </optgroup>
    </select>

    <label for="description">Project Description:</label>
    <textarea id="description" name="description" placeholder="Describe what you'd like..." required></textarea>

    <button type="submit">Submit Order</button>
  </form>
</body>
</html>
