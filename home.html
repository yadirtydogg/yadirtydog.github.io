<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HOME</title>
  <style>
    body {
      margin: 0;
      background: white;
      font-family: sans-serif;
      color: red;
    }

    

    a {
      color: red;
      text-decoration: none;
    }

    main {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 3em;
      padding: 4em 2em;
      flex-wrap: wrap;
    }

    .id-card {
      max-width: 340px;
      filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.2));
    }

    .bio {
      max-width: 400px;
      font-size: 1.1em;
      line-height: 1.6em;
      font-weight: bold;
    }

    .socials {
      text-align: center;
      margin-top: 6em;
      font-size: 3em;
      font-weight: bold;
      letter-spacing: 0.3em;
    }

    .socials a {
      color: red;
      text-decoration: none;
      margin: 0 0.3em;
    }

    /* optional hover fx */
    .socials a:hover {
      text-decoration: underline;
    }
  
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5em 2em;
      font-weight: bold;
      font-size: 1.4em;
    }

    nav a {
      color: red;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.4em;
    }

</style>
</head>
<body>

  <nav>
    <a href="menu.html">menu</a>
    <a href="work.html">work</a>

  <main>

    <div class="bio">
      I'm a multimedia artist working mainly in photoshop/davinci. I program as a hobby but I'm working to become a fullstack dev. If you have any questions or if you just wanna say hi, you can find me @yadirtydog on most socials!
    </div>
  </main>

  <div class="socials">
    <a href="https://x.com/yadirtydog" target="_blank">X</a>

    <a href="https://instagram.com/yadirtydog" target="_blank">IG</a>
  </div>
