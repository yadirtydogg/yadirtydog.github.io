<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Work - YADIRTYDOG</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }

    body {
      background-image: url('images/car-dashboard.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: bottom center;
      position: relative;
    }

    

    

    .hanger {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .tilted {
      position: absolute;
      top: 0;
      left: 0;
    }

    .merch-tilt {
      top: -8%;
      left: 49%;
      transform: rotate(23deg);
      transform-origin: top center;
    }

    .posters-tilt {
      top: -10%;
      left: 47%;
      transform: rotate(-23deg);
      transform-origin: top center;
    }

    .logo-tilt {
      top: -9%;
      left: 48%;
      transform: rotate(0deg);
      transform-origin: top center;
    }


    .swinger {
      position: relative;
      width: 170px;
      height: auto;
      transform-origin: top center;
      animation: idleSwing 3s ease-in-out infinite;
      transition: transform 0.3s ease;
      pointer-events: auto;
    }

    .swinger:hover {
      animation-play-state: paused;
      transform: translateY(20px);
      filter: drop-shadow(0 0 5px rgb(116, 0, 0));
    }

    .tree-container {
      position: relative;
      width: 100%;
    }

    .tree-img {
      width: 100%;
      display: block;
      pointer-events: none;
    }

    .tree-hitbox {
      position: absolute;
      width: 50%;
      height: 14%;
      bottom: 5%;
      left: 25%;
      pointer-events: auto;
      z-index: 3;
      cursor: pointer;
      /* Uncomment below to visualize while testing */
      /* background: rgba(255, 0, 0, 0.3); */
    }

    @keyframes idleSwing {
      0%, 100% { transform: rotate(1deg); }
      50% { transform: rotate(-1deg); }
    }
  
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5em 2em;
      font-weight: bold;
      font-size: 1.4em;
    }

    nav a {
      color: red;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.4em;
    }

</style>
</head>
<body>

  <nav>
    <a href="home.html">home</a>
    <a href="menu.html">menu</a>
  </nav>  

  <div class="hanger">
    <div class="tilted merch-tilt">
      <div class="swinger">
        <div class="tree-container">
          <img src="images/tree-merch.png" class="tree-img" alt="MERCH">
          <a href="merch.html" class="tree-hitbox"></a>
        </div>
      </div>
    </div>

    <div class="tilted posters-tilt">
      <div class="swinger">
        <div class="tree-container">
          <img src="images/tree-posters.png" class="tree-img" alt="POSTERS">
          <a href="posters.html" class="tree-hitbox"></a>
        </div>
      </div>
    </div>

    <div class="tilted logo-tilt">
      <div class="swinger">
        <div class="tree-container">
          <img src="images/tree-logo.png" class="tree-img" alt="LOGO">
          <a href="logo.html" class="tree-hitbox"></a>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
